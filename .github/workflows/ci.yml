name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t land-agent-poc:test .

    - name: Start container
      run: |
        docker run -d --name test-container -p 8000:8000 land-agent-poc:test
        
    - name: Wait for service to be ready
      run: |
        echo "Waiting for service to start..."
        for i in {1..30}; do
          if curl -f http://localhost:8000/health; then
            echo "Service is ready!"
            break
          fi
          echo "Attempt $i: Service not ready, waiting..."
          sleep 2
        done

    - name: Test health endpoint
      run: |
        response=$(curl -s http://localhost:8000/health)
        echo "Health response: $response"
        if echo "$response" | grep -q '"status":"ok"'; then
          echo "✓ Health check passed"
        else
          echo "✗ Health check failed"
          exit 1
        fi

    - name: Test RAG index endpoint
      run: |
        echo "Testing RAG index endpoint..."
        curl -X POST http://localhost:8000/rag/index -v || echo "RAG index completed (no texts available)"

    - name: Test process endpoint (with dummy data)
      run: |
        echo "Testing process endpoint..."
        # Create a simple test image
        echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==" | base64 -d > test.png
        
        # Test the process endpoint
        curl -X POST http://localhost:8000/process \
          -F "file=@test.png" \
          -F "province=ha_noi" \
          -F "contract_value=1000000000" \
          -v || echo "Process endpoint test completed"

    - name: Show container logs
      if: always()
      run: |
        echo "=== Container logs ==="
        docker logs test-container

    - name: Clean up
      if: always()
      run: |
        docker stop test-container || true
        docker rm test-container || true